<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta   name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Join Game</title>
    <link rel="stylesheet" href="/src/style.css">
    
    <script type="module" src="/src/player.ts"></script>
</head>

<body>
    <main>
        
        <!-- JOIN -->
        <section id="join-view">
            <h1>Join Game</h1>
            
            <form id="join-form">
                <div>
                    <label for="name">Your name</label>
                    
                    <input 
                    id="name"
                    type="text"
                    placeholder="Enter name"
                    maxlength="20"
                    required
                    >
                </div>
                
                <button type="submit">
                    Join
                </button>
            </form>
            
            <p id="status">Connecting...</p>
        </section>
        
        
        <!-- LOBBY -->
        <section id="lobby-view" hidden>
            <h1>You're in!</h1>
            
            <p id="joined-name"></p>
            
            <p>Waiting for the host...</p>
        </section>
        
        
        <!-- PLAYING -->
        <section id="playing-view" hidden>
            <p id="round-number"></p>
            
            <h1 class="prompt"></h1>
            
            <h2>Your answer</h2>
            
            <div id="answer">
                <p id="answer-placeholder">
                    Tap words below to build your answer
                </p>
            </div>
            
            <h2>Available words</h2>
            
            <div id="words"></div>
            
            <button id="submit-answer" disabled>
                Submit Answer
            </button>
        </section>
        
        
        <section id="submitted-view" hidden>
            <h1>Answer submitted!</h1>
             <h2 class="prompt"></h2>
            <p>Your answer:</p>
            
            <div id="submitted-answer"></div>
            
            <p>Waiting for the other players...</p>
        </section>
        
        
        <section id="ranking-view" hidden>
            <p id="ranking-round-number"></p>
            

            <h1>Rank by funny-ness</h1>
            <h2 class="prompt"></h2>
            
           <ul id="answers-to-rank"></ul>
        
            <button id="submit-ranking" disabled>
                Submit Ranking
            </button>
        </section>
        
    </main>
    
    <script type="module" src="/src/player.ts" ></script>
</body>
