# Production setup. Nothing here publishes a port: the only way in is the Cloudflare tunnel,
# which reaches the game over Docker's internal network at http://game:3000.
# Local development adds ports from compose.dev.yaml (see the README).

# Docker keeps container logs forever by default; cap each container at 3 files of 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  game:
    build: .
    container_name: gameaiwordgame
    restart: unless-stopped
    logging: *logging
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/wordgame?authSource=admin

    depends_on:
      mongo:
        condition: service_healthy


  mongo:
    image: mongo:9.0
    container_name: gameaiwordgame-mongo
    restart: unless-stopped
    logging: *logging

    # used when Mongo creates its database for the first time.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

    # Mongo stores its actual database files here.
    # The Docker volume survives container replacement/rebuilds.
    volumes:
      - mongo_data:/data/db

    # `ping` needs no login, so the password stays out of the healthcheck command.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gameaiwordgame-tunnel
    restart: unless-stopped
    logging: *logging

    # only start Cloudflare for production deployments.
    profiles:
      - production
    command: tunnel --no-autoupdate run
    # Read from the environment rather than the command line, where any user on the host could see it in `ps`.
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - game


# persistent Docker-managed storage.
#
# `docker compose down` keeps this.
# `docker compose down -v` DELETES it.
volumes:
  mongo_data:
